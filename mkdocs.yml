site_name: nomad-battery-space
site_description: A schema package plugin for data space @HZB
site_author: Svetlana Grinman

repo_url: https://github.com/nomad-hzb/nomad-battery-space
edit_uri: ""

nav:
  - Home: index.md
  - Tutorial: 
      - Overview: tutorial/tutorial.md
      - Workflow...: tutorial/register_bat_sample.md
      - Register Coin Cell Sample: tutorial/register_coin_cell.md
  - How-to guides:
      - Install this Plugin: how_to/install_this_plugin.md
      - Use this Plugin: how_to/use_this_plugin.md
      - Contribute to this plugin: how_to/contribute_to_this_plugin.md
  - Explanation: 
      - Overview: explanation/overview.md
      - Reference Model: explanation/reference_model.md
      - Component Types: explanation/component_types.md
      - Cell Assembly Types: explanation/cell_assembly_types.md
  - Reference: reference/references.md
plugins:
  - search
theme:
  name: material
  palette:
    primary: "#2A4CDF"
    accent: "#008A67"
  font:
    text: "Titillium Web"
  logo: assets/nomad-plugin-logo.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
  custom_dir: docs/theme
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: True
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - mkdocs-click
  - pymdownx.extra
extra:
  generator: false
  homepage: https://nomad-lab.eu
use_directory_urls: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascript.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
