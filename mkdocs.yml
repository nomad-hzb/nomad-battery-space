site_name: nomad-battery-space
site_description: A schema package plugin for data space @HZB
site_author: Svetlana Grinman

repo_url: https://github.com/nomad-hzb/nomad-battery-space
edit_uri: ""

nav:
  - Home: index.md
  - Tutorial: 
      - Overview: tutorial/tutorial.md
      - Workflow...: tutorial/register_bat_sample.md
      - Register Coin Cell Sample: tutorial/register_coin_cell.md
  - How-to guides:
      - Install this Plugin: how_to/install_this_plugin.md
      - Use this Plugin: how_to/use_this_plugin.md
      - Contribute to this plugin: how_to/contribute_to_this_plugin.md
  - Data Model Explanation:
      - Overview: explanation/overview.md
      - Materials and Components: explanation/component_types.md
      - Links between Entries: explanation/reference_model.md
      - Battery Cells: explanation/cell_assembly_types.md
      - Measurements: explanation/measurements.md
  - Reference: reference/references.md
plugins:
  - search
  - glightbox
theme:
  logo: assets/Dataspace_logo.png
  name: material
  palette:
    # 1. Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # 2. Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
    # 3. Auto
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
  font:
    text: "Titillium Web"
  favicon: assets/favicon.png
  features:
    - navigation.path
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  custom_dir: docs/theme
  icon:
    #logo: nomad/nomad-logo-unfilled
    repo: fontawesome/brands/github
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - mkdocs-click
  - pymdownx.extra
  - toc:
      permalink: True
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - docs/theme/.icons
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra:
  generator: false
  homepage: https://nomad-lab.eu
use_directory_urls: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
